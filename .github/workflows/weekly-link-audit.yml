name: Weekly Link Audit

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  link-audit:
    name: Verify configured Holt Holdings links
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Validate theme link configuration
        shell: bash
        run: |
          set -euo pipefail

          if grep --fixed-strings 'https://a.co/d/0aEp6yu6' functions.php front-page.php footer.php README.md; then
            echo "FAIL: Known broken Amazon short URL is present."
            exit 1
          fi

          if grep -R --include='*.php' --fixed-strings 'href="#"' .; then
            echo "FAIL: Fake href placeholder is present."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('functions.php', 'utf8');
          const homepage = fs.readFileSync('front-page.php', 'utf8');
          const components = fs.readFileSync('template-parts/site-components.php', 'utf8');
          const products = fs.readFileSync('page-digital-products.php', 'utf8');
          const merch = fs.readFileSync('page-merch.php', 'utf8');
          const pages = ['page-businesses-projects.php', 'page-digital-products.php', 'page-tools-resources.php', 'page-merch.php', 'page-about.php', 'page-contact.php'];
          const failures = [];
          const payhip = [...source.matchAll(/https:\/\/payhip\.com\/(?:LowVoltHolt|b\/[A-Za-z0-9]+)/g)].map((m) => m[0]);
          const uniquePayhip = [...new Set(payhip)];

          if (uniquePayhip.length < 13) failures.push(`Expected at least 13 configured Payhip URLs; found ${uniquePayhip.length}.`);
          if (!pages.every((file) => fs.existsSync(file))) failures.push('One or more required page templates are missing.');
          if (!source.includes('holt_holdings_site_pages') || !source.includes('businesses-projects') || !source.includes('digital-products')) failures.push('Managed WordPress page creation is incomplete.');
          if (!source.includes('https://lowvoltvault.com') || !products.includes('holt_holdings_product_portals')) failures.push('LowVolt Vault product page is missing.');
          if (!products.includes('Individual Guide Downloads')) failures.push('Digital product positioning is missing.');
          if (!merch.includes('holt_holdings_merch_form') || !components.includes('data-merch-status')) failures.push('Dedicated merchandise catalog is incomplete.');
          if (!components.includes('holt_merch_nonce') || !source.includes("wp_verify_nonce")) failures.push('Merchandise nonce validation is missing.');
          if (!components.includes('name="website"')) failures.push('Merchandise honeypot is missing.');
          if (homepage.includes('holt_holdings_merch_form')) failures.push('Homepage duplicates the full merchandise form.');
          for (const route of ['/businesses-projects/', '/digital-products/', '/tools-resources/', '/merch/', '/about/', '/contact/']) {
            if (!homepage.includes(route)) failures.push(`Homepage is missing curated link to ${route}.`);
          }
          if (!source.includes("register_post_type( 'holt_merch_request'") || !source.includes("wp_insert_post(")) failures.push('WordPress merchandise request backup storage is missing.');
          if (!source.includes("wp_mail(")) failures.push('Merchandise email delivery is missing.');
          if (!source.includes("'merch_recipient_email'") || !source.includes("'holtholdingsllc@outlook.com'")) failures.push('Correct merchandise recipient setting is missing.');
          if (!source.includes("'_email_destination'") || !source.includes("'_email_status'") || !source.includes("'_email_error'")) failures.push('Merchandise mail audit metadata is incomplete.');
          if (!source.includes("'merch_customer'") || !source.includes("'merch_product'") || !source.includes('Email handoff details')) failures.push('Merchandise request admin visibility is incomplete.');
          if (!source.includes('holt_merch_rate_') || !source.includes('holt_merch_dup_')) failures.push('Merchandise rate/duplicate protection is missing.');
          if (source.includes('View GitHub') || source.includes('bitready_github')) failures.push('BitReady GitHub promotion remains in public theme configuration.');
          if (/deploy test|deploy automation active|weekly audit enabled/i.test(fs.readFileSync('footer.php', 'utf8'))) failures.push('Legacy deployment/test comments remain in footer.php.');

          for (const failure of failures) console.error(`FAIL: ${failure}`);
          console.log(`PASS: ${uniquePayhip.length} unique Payhip URLs are configured from the homepage source of truth.`);
          console.log(`SUMMARY: ${failures.length ? 0 : 1} PASS, 0 WARN, ${failures.length} FAIL`);
          if (failures.length) process.exit(1);
          NODE

      - name: Lint WordPress PHP
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
