name: Weekly Site Audit

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  site-audit:
    name: Audit live Holt Holdings site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run live-site audit
        run: node .github/scripts/site-audit.mjs

      - name: Responsive smoke audit
        run: |
          npm install --no-save playwright@1.45.3
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = await import('playwright');

          const viewports = [
            { name: 'small-mobile', width: 320, height: 720 },
            { name: 'mobile', width: 375, height: 812 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'laptop', width: 1024, height: 768 },
            { name: 'desktop', width: 1280, height: 900 }
          ];

          const failures = [];
          const routes = ['/', '/businesses-projects/', '/digital-products/', '/tools-resources/', '/merch/', '/about/', '/contact/'];
          const browser = await chromium.launch();
          const page = await browser.newPage({
            viewport: viewports[0],
            userAgent: 'Holt Holdings weekly site audit'
          });
          const consoleErrors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') {
              consoleErrors.push(message.text());
            }
          });
          for (const route of routes) {
            await page.goto(`https://holtholdings.us${route}`, { waitUntil: 'networkidle' });
            for (const viewport of viewports) {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              const result = await page.evaluate(() => {
              const nav = document.querySelector('.primary-navigation');
              const activeLinks = Array.from(document.querySelectorAll('a[href]')).filter((link) => {
                const href = link.getAttribute('href') || '';
                const style = window.getComputedStyle(link);
                return href && href !== '#' && style.pointerEvents !== 'none';
              });

              return {
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                hasNav: Boolean(nav),
                h1Count: document.querySelectorAll('h1').length,
                activeLinks: activeLinks.length,
                phpError: /Fatal error|Warning:|Notice:|Parse error/i.test(document.body.innerText)
              };
            });

              if (result.overflow) failures.push(`${route} ${viewport.name}: horizontal overflow detected`);
              if (!result.hasNav) failures.push(`${route} ${viewport.name}: navigation missing`);
              if (result.h1Count !== 1) failures.push(`${route} ${viewport.name}: expected one H1, found ${result.h1Count}`);
              if (result.activeLinks === 0) failures.push(`${route} ${viewport.name}: no active links found`);
              if (result.phpError) failures.push(`${route} ${viewport.name}: visible PHP/WordPress error found`);
            }
          }
          if (consoleErrors.length > 0) failures.push(`console errors: ${consoleErrors.slice(0, 5).join(' | ')}`);

          await page.close();
          await browser.close();

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log('Responsive smoke audit passed.');
          NODE

      - name: Optional Lighthouse audit
        continue-on-error: true
        run: |
          npx --yes lighthouse https://holtholdings.us \
            --quiet \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,seo \
            --output=json \
            --output-path=./lighthouse-report.json

          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('lighthouse-report.json','utf8')); for (const [name,data] of Object.entries(r.categories)) { console.log(name + ': ' + Math.round(data.score * 100)); }"
